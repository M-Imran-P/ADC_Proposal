name: Apply Approved Content Restore

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-approved-content-restore.yml'
      - 'scripts/restore-approved-content.py'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore approved finalised content
        run: python scripts/restore-approved-content.py
      - name: Build verification
        run: npm install && npm run build
      - name: Commit approved restoration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "Restore finalised 13-page content with approved exceptions" || exit 0
          git push
