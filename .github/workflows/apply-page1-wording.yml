name: Apply page 1 wording refinement

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-page1-wording.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply exact authorised replacements
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          s = p.read_text()
          replacements = [
              ('2026 Proposal Matrix — Residential Turnkey Construction', 'Residential Turnkey Construction', 1),
              ('<td>MEP as per package standards</td>', '<td>as per package standards</td>', 2),
              ('<td>Detailed MEP drawing floor wise</td>', '<td>floor wise drawings</td>', 1),
          ]
          for old, new, expected in replacements:
              actual = s.count(old)
              if actual != expected:
                  raise SystemExit(f'Expected {expected} occurrence(s) of {old!r}, found {actual}')
              if expected == 1:
                  s = s.replace(old, new, 1)
              else:
                  s = s.replace(old, new)
          old = '<td>floor wise drawings</td>\n                <td>Detailed MEP drawing floor wise</td>'
          # The first replacement above changes only the first detailed cell; now change the remaining Executive cell exactly.
          remaining = '<td>Detailed MEP drawing floor wise</td>'
          if s.count(remaining) != 1:
              raise SystemExit(f'Expected 1 remaining Executive detailed MEP cell, found {s.count(remaining)}')
          s = s.replace(remaining, '<td>floor wise detailed drawings</td>', 1)
          p.write_text(s)
          PY
      - name: Commit source update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "Apply requested page 1 wording refinements"
          git push
