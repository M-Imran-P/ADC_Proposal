name: Fix Master Waterproofing Content
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-waterproofing-master.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore exact finalised waterproofing wording
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/App.tsx')
          s=p.read_text()
          s=s.replace('Dr. Fixit / Fosroc or equivalent — waterproofing', 'Dr. Fixit / FOSROC or equivalent — waterproofing')
          s=s.replace('Dr. Fixit / Fosroc + chemical waterproofing system', 'Crystalline waterproofing (Zydex / Fosroc) + chemical waterproofing system')
          s=s.replace('Dr. Fixit / Fosroc + terrace screed with WP component', 'Dr. Fixit / FOSROC + terrace screed with WP component')
          assert 'Crystalline waterproofing (Zydex / Fosroc) + chemical waterproofing system' in s
          assert 'CPVC SDR 11' in s
          assert s.index('id="sec-6"') < s.index('id="sec-7"') < s.index('id="sec-8"')
          p.write_text(s)
          PY
      - name: Build verification
        run: npm install && npm run build
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "Restore finalised waterproofing specification" || exit 0
          git push
